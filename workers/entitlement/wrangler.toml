name = "entitlement"
main = "index.ts"
compatibility_date = "2026-08-19"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "ENTITLEMENT_DB"
database_name = "entitlement-db"
database_id = "e9e18c25-0e25-48f3-9439-3fcd755f98c0"

[triggers]
crons = ["0 0 1 * *"]

[observability]
enabled = true

[vars]
HONEYCOMB_API_KEY = ""  # set via wrangler secret put HONEYCOMB_API_KEY
HONEYCOMB_DATASET = "p31-entitlement"

# WS-1 x402 paywall — first deploy: Mogami facilitator on Base Sepolia (no real money).
# X402_FACILITATOR: cdp | mogami | self | auto
X402_FACILITATOR = "mogami"
X402_NETWORK = "eip155:84532"
X402_PAY_TO = "0x51c285Df171C76bE36252e32679F098d90768413"
X402_ASSET = "0x036CbD53842c5426634e7929541eC2318f3dCF7e"  # Base Sepolia USDC
X402_SELF_HOSTED_URL = ""  # used only when X402_FACILITATOR=self
ALLOWED_ORIGINS = "https://p31-monetization.trimtab-signal.workers.dev,https://monetization.p31ca.org,https://p31ca.org,https://www.p31ca.org,http://localhost:5173,http://localhost:4173,capacitor://localhost"

# Secrets (wrangler secret put, never in code):
#   CDP_API_KEY_ID, CDP_API_KEY_SECRET  — required only when X402_FACILITATOR=cdp
#   X402_SELF_HOSTED_URL                 — required only when X402_FACILITATOR=self
