name = "capital-allocator"
main = "src/index.ts"
compatibility_date = "2026-08-19"
compatibility_flags = ["nodejs_compat"]

[placement]
mode = "smart"

[[d1_databases]]
binding = "ALLOCATOR_DB"
database_name = "allocator-db"
database_id = "d12543b9-f273-4f35-bfeb-66ce5a4800b1"

[observability]
enabled = true
head_sampling_rate = 0.1

[vars]
REVENUE_LEDGER_URL = "https://revenue-ledger.trimtab-signal.workers.dev"
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "https://p31-monetization.trimtab-signal.workers.dev,https://monetization.p31ca.org,https://p31ca.org,https://www.p31ca.org,http://localhost:5173,http://localhost:4173,capacitor://localhost"
HONEYCOMB_API_KEY = ""  # set via wrangler secret put HONEYCOMB_API_KEY
HONEYCOMB_DATASET = "p31-capital-allocator"

[env.production]
vars = { ENVIRONMENT = "production" }

[env.staging]
vars = { ENVIRONMENT = "staging" }
