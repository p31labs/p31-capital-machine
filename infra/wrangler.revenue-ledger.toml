name = "revenue-ledger"
main = "../workers/revenue-ledger/index.ts"
compatibility_date = "2026-08-19"
compatibility_flags = ["nodejs_compat"]

[placement]
mode = "smart"

[[d1_databases]]
binding = "REVENUE_DB"
database_name = "revenue-ledger-db"
database_id = "d5d1817c-6bde-496e-8226-0687c9556d86"

[observability]
enabled = true
head_sampling_rate = 0.1

[env.production]
vars = { ENVIRONMENT = "production" }

[env.staging]
vars = { ENVIRONMENT = "staging" }

[vars]
HONEYCOMB_API_KEY = ""  # set via wrangler secret put HONEYCOMB_API_KEY
HONEYCOMB_DATASET = "p31-revenue-ledger"
