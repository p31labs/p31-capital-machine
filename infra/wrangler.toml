# P31 Capital Machine - wrangler.toml

name = "capital-machine"
main = "../workers/capital-machine/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[placement]
mode = "smart"

[[d1_databases]]
binding = "CAPITAL_DB"
database_name = "capital-db"
database_id = "d7f0afea-6c49-46e3-a225-6353367578f2"

[[kv_namespaces]]
binding = "CAPITAL_KV"
id = "d81cd27a8b5f4d58905a49081c436ad9"

[observability]
enabled = true
head_sampling_rate = 0.1

[env.production]
vars = { ENVIRONMENT = "production" }

[env.staging]
vars = { ENVIRONMENT = "staging" }

# @p31 STALE IDs — per-worker wrangler.toml files have the correct account-specific IDs
# (yield-vault/mev-arbitrage use 93485b8c-..., revenue-ledger uses 4d8c6c09-..., etc.)
# Do NOT deploy from this file without first reconciling IDs against `wrangler d1 list`.

